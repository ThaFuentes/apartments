<label>Every
  <select name="every_days">
    <option value="30" {% if selected|default(30) == 30 %}selected{% endif %}>1 month</option>
    <option value="60" {% if selected|default(30) == 60 %}selected{% endif %}>2 months</option>
    <option value="90" {% if selected|default(30) == 90 %}selected{% endif %}>3 months</option>
    <option value="180" {% if selected|default(30) == 180 %}selected{% endif %}>6 months</option>
    <option value="365" {% if selected|default(30) == 365 %}selected{% endif %}>1 year</option>
  </select>
</label>
<label>Or a number of days <input name="every_days_custom" inputmode="numeric" placeholder="45"></label>
