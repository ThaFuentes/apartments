<button type="button" class="chat-fab" id="chat-open" aria-expanded="false" aria-controls="chat-panel">Chat</button>
<section class="chat-panel" id="chat-panel" hidden>
  <header class="chat-bar">
    <strong>{{ assistant_name or "Apt" }}</strong>
    <div class="chat-actions">
      <button type="button" class="quiet" id="chat-new">New</button>
      <button type="button" class="quiet" id="chat-close">Close</button>
    </div>
  </header>
  {% include "chat_thread.html" %}
</section>
